<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>X-Flow</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #eff3f4;
      --text: #0f1419;
      --text-muted: #536471;
      --primary: #1d9bf0;
      --danger: #f4212e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --border: #2f3336;
        --text: #e7e9ea;
        --text-muted: #71767b;
        --primary: #1d9bf0;
        --danger: #f4212e;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 260px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .row label {
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cfd9de;
    }

    .status-dot.ok { background: #00ba7c; }
    .status-dot.warn { background: var(--danger); }

    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="brand-name">X-Flow</div>
  </div>

  <div class="row">
    <label for="enabled">在推特上启用插件</label>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="status-list">
    <div class="status-item">
      <span id="dotApi" class="status-dot"></span>
      <span id="textApi">检查 DeepSeek API…</span>
    </div>
    <div class="status-item">
      <span id="dotObs" class="status-dot"></span>
      <span id="textObs">检查 Obsidian Vault…</span>
    </div>
  </div>

  <button id="openOptions">打开扩展设置</button>

  <script src="popup.js"></script>
</body>
</html>
